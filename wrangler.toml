name = "website-monitor"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 每个账号一对 “用户名:密码”，多个用户用英文逗号分隔，例如：
#   alice:password123,bob:secret456
# 部署时建议通过 Secret 设置（生产环境）或 .dev.vars（本地开发），
# 见 README「环境变量」一节。
# [vars]
# USERS = "alice:password123"

# ---------- D1 数据库 ----------
# database_id 部署前需要替换成真实值（见 README），GitHub Actions 会自动填充。
[[d1_databases]]
binding = "DB"
database_name = "website-monitor-db"
database_id = "replace-with-your-database-id"

# 说明：所有数据（用户、监测目标、通知设置、内容哈希、登录会话）均存储在 D1，
# 不依赖 KV，以避开 KV 免费版每天读写次数限制。

# ---------- 定时任务 ----------
# 每分钟触发一次，代码内部会按每个监测目标的“间隔”决定是否真正检查。
[triggers]
crons = ["* * * * *"]
